<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="busLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#334155" fill-opacity="0.6" />
    </pattern>

    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
        50% { transform: translateY(-10px) translateX(15px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      }
      @keyframes packetTransitA {
        0% { cx: 120; cy: 180; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cx: 480; cy: 180; opacity: 0; }
      }
      @keyframes packetTransitB {
        0% { cx: 1080; cy: 180; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cx: 720; cy: 180; opacity: 0; }
      }
      .node-pulse { animation: pulseNode 3s infinite ease-in-out; transform-origin: center; }
      .bus-stream { stroke-dasharray: 8 6; animation: dashFlow 8s linear infinite; }
      .particle { animation: floatParticle 5s infinite ease-in-out; }
      .packet-a { animation: packetTransitA 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .packet-b { animation: packetTransitB 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#gridPattern)" />
  <circle cx="600" cy="180" r="320" fill="url(#centerGlow)" />

  <!-- Outer Border -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Dynamic Circuit / Synchronization Bus Network (Background Layer) -->
  <g opacity="0.75">
    <!-- Bus Main Backbone Line -->
    <path d="M 80 180 L 1120 180" stroke="url(#busLineGrad)" stroke-width="3" fill="none" />
    <path d="M 80 180 L 1120 180" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" fill="none" class="bus-stream" />

    <!-- Branch Lines Top -->
    <path d="M 220 180 L 220 80 L 360 80" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5" fill="none" />
    <path d="M 980 180 L 980 80 L 840 80" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" fill="none" />

    <!-- Branch Lines Bottom -->
    <path d="M 280 180 L 280 280 L 420 280" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" fill="none" />
    <path d="M 920 180 L 920 280 L 780 280" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.5" fill="none" />

    <!-- Network Agent Nodes (Left Cluster) -->
    <circle cx="120" cy="180" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="120" cy="180" r="6" fill="#38bdf8" class="node-pulse" />
    <text x="120" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">Agent-α</text>

    <circle cx="220" cy="80" r="10" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    <circle cx="220" cy="80" r="4" fill="#818cf8" />
    <text x="220" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Pub/Sub</text>

    <circle cx="280" cy="280" r="10" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <circle cx="280" cy="280" r="4" fill="#06b6d4" />
    <text x="280" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">NATS KV</text>

    <!-- Network Agent Nodes (Right Cluster) -->
    <circle cx="1080" cy="180" r="14" fill="#0f172a" stroke="#c084fc" stroke-width="2.5" />
    <circle cx="1080" cy="180" r="6" fill="#c084fc" class="node-pulse" />
    <text x="1080" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">Agent-ω</text>

    <circle cx="980" cy="80" r="10" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    <circle cx="980" cy="80" r="4" fill="#a855f7" />
    <text x="980" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">A2A Router</text>

    <circle cx="920" cy="280" r="10" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <circle cx="920" cy="280" r="4" fill="#ec4899" />
    <text x="920" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">State Lock</text>

    <!-- Transiting Data Packets -->
    <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#glow)" class="packet-a" />
    <circle cx="0" cy="0" r="5" fill="#c084fc" filter="url(#glow)" class="packet-b" />

    <!-- Ambient Floating Particles -->
    <circle cx="340" cy="120" r="2.5" fill="#38bdf8" class="particle" />
    <circle cx="860" cy="240" r="2" fill="#c084fc" class="particle" style="animation-delay: 2s;" />
    <circle cx="500" cy="90" r="2" fill="#818cf8" class="particle" style="animation-delay: 3s;" />
    <circle cx="700" cy="290" r="2.5" fill="#34d399" class="particle" style="animation-delay: 1.5s;" />
  </g>

  <!-- Foreground Protective Card Backplate to Ensure 100% Foreground Text Legibility -->
  <rect x="230" y="42" width="740" height="276" rx="14" fill="#070c18" fill-opacity="0.88" stroke="#334155" stroke-opacity="0.7" stroke-width="1" filter="url(#softGlow)" />

  <!-- Foreground Text Content -->
  <g>
    <!-- Top Pill Badge -->
    <g transform="translate(600, 75)">
      <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="-148" cy="0" r="4" fill="#10b981" />
      <text x="-134" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#93c5fd" letter-spacing="0.8">⚡ DISTRIBUTED COORDINATION &amp; STATE BUSSES</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="33" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="-0.5">
      Awesome Multi-Agent
    </text>
    <text x="600" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="33" font-weight="800" text-anchor="middle" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Synchronization Busses
    </text>

    <!-- Subtitle -->
    <text x="600" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="500" text-anchor="middle" fill="#cbd5e1" letter-spacing="0.2">
      Low-Latency State Management • Agent-to-Agent Messaging • Distributed Coordination
    </text>

    <!-- Ecosystem Capability Pills / Tags -->
    <g transform="translate(600, 268)">
      <!-- Pill 1: A2A Protocol -->
      <g transform="translate(-240, 0)">
        <rect x="-55" y="-12" width="110" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
        <text x="0" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7dd3fc" text-anchor="middle">A2A Protocol</text>
      </g>
      <!-- Pill 2: NATS JetStream -->
      <g transform="translate(-120, 0)">
        <rect x="-55" y="-12" width="110" height="24" rx="6" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
        <text x="0" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">NATS / Redis</text>
      </g>
      <!-- Pill 3: Matrix Protocol -->
      <g transform="translate(0, 0)">
        <rect x="-55" y="-12" width="110" height="24" rx="6" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
        <text x="0" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d8b4fe" text-anchor="middle">Matrix E2EE</text>
      </g>
      <!-- Pill 4: MCP Bridge -->
      <g transform="translate(120, 0)">
        <rect x="-55" y="-12" width="110" height="24" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1" />
        <text x="0" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fda4af" text-anchor="middle">MCP Data Plane</text>
      </g>
      <!-- Pill 5: State Stores -->
      <g transform="translate(240, 0)">
        <rect x="-55" y="-12" width="110" height="24" rx="6" fill="#1e293b" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
        <text x="0" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="middle">Shared Memory</text>
      </g>
    </g>
  </g>
</svg>
